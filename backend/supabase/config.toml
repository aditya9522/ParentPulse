# Supabase CLI project configuration for ParentPulse
project_id = "parentpulse"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["parentpulse://auth/callback", "http://localhost:8081"]
jwt_expiry = 3600
enable_signup = true
